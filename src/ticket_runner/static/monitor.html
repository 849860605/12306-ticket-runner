<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实时流程 · 候车</title><link rel="stylesheet" href="/assets/styles.css"><script src="/assets/monitor.js" defer></script></head>
<body class="monitor-body"><main class="flow-panel"><div class="flow-status"><div><div class="eyebrow" id="flow-mode">LIVE ACTIVITY</div><h1 id="phase-title">连接控制台…</h1></div><span id="flow-connection" class="pill neutral">连接中</span></div><p id="phase-description" class="flow-description">正在读取执行器的真实状态。</p><div class="metrics"><div><span>本次查询</span><strong id="query-count">0<small>次</small></strong></div><div><span>查询节拍</span><strong id="query-interval">—<small>秒</small></strong></div><div><span>持续时间</span><strong id="elapsed">—</strong></div></div><ol id="flow-steps" class="flow-steps"><li data-step="0"><span class="step-marker">1</span><div><strong>登录与订单检查</strong><small>确认账号可以开始购票</small></div></li><li data-step="1"><span class="step-marker">2</span><div><strong>循环查询与筛选</strong><small>无符合条件的票就继续等候</small></div></li><li data-step="2"><span class="step-marker">3</span><div><strong>选人、选席别、核对预算</strong><small>严格按你保存的条件执行</small></div></li><li data-step="3"><span class="step-marker">4</span><div><strong>提交并核对订单</strong><small>结果不明确，停止重复提交</small></div></li><li data-step="4"><span class="step-marker">5</span><div><strong>待支付 · 停止抢票</strong><small>不自动付款，由你去官方处理</small></div></li></ol><div class="event-heading"><h2>实时日志</h2><span id="event-count" class="muted small">0 条</span></div><div id="event-log" class="event-log" role="log" aria-live="polite"><p class="muted small">启动后将显示每一步的真实进展。</p></div><div id="monitor-safety" class="monitor-safety">此小窗只读。关闭小窗不会停止任务。</div></main></body></html>
