services:
  runner:
    build: .
    image: ticket-runner:local
    init: true
    command: ["--config", "/config/config.yaml", "--data-dir", "/data", "serve", "--host", "0.0.0.0", "--port", "8080"]
    restart: "on-failure:3"
    shm_size: "1gb"
    environment:
      TZ: Asia/Shanghai
      ENABLE_DESKTOP: "1"
      TICKET_NOTIFY_WEBHOOK: ${TICKET_NOTIFY_WEBHOOK:-}
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ticket-data:/data
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:6080:6080"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ticket-data:
