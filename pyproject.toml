[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ticket-runner"
version = "0.1.0"
description = "Configuration-driven personal 12306 browser runner"
requires-python = ">=3.11"
dependencies = ["playwright==1.58.0", "pydantic>=2.10,<3", "PyYAML>=6.0.2,<7"]

[project.scripts]
ticket-runner = "ticket_runner.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
